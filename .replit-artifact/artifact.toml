kind = "web"
previewPath = "/"
title = "Blue Valor Logistics"
version = "1.0.0"
id = "artifacts/blue-kool"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22293

[services.development]
run = "pnpm --filter @workspace/blue-kool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/blue-kool", "run", "build" ]
serve = "static"
publicDir = "artifacts/blue-kool/dist/public"

[[services.production.rewrites]]
from = "/services"
to = "/index.html"

[[services.production.rewrites]]
from = "/services/"
to = "/index.html"

[[services.production.rewrites]]
from = "/shippers/admin"
to = "/index.html"

[[services.production.rewrites]]
from = "/shippers/admin/"
to = "/index.html"

