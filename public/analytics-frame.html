<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Blue Valor Logistics</title>
</head>
<body>
<script>
  // This document intentionally contains no forms and never changes its URL.
  // Only the parent's allowlisted static route is sent to Google Analytics.
  let configured = false;
  let lastPath = '';
  const pendingConversions = [];
  const titles = {
    '/': 'Home', '/services': 'Services',
    '/services/refrigerated-freight': 'Refrigerated Freight',
    '/services/dry-van-freight': 'Dry Van Freight',
    '/services/flatbed-freight': 'Flatbed Freight',
    '/shippers': 'Shippers', '/carriers': 'Carriers', '/about': 'About',
    '/contact': 'Contact', '/quote': 'Request a Quote',
    '/privacy-policy': 'Privacy Policy', '/terms': 'Terms & Conditions',
    '/404': 'Page Not Found'
  };
  const pages = new Set(['/', '/services', '/services/refrigerated-freight',
    '/services/dry-van-freight', '/services/flatbed-freight', '/shippers',
    '/carriers', '/about', '/contact', '/quote', '/privacy-policy', '/terms', '/404']);
  window.dataLayer = [];
  function gtag() { window.dataLayer.push(arguments); }
  function sendConversion(message) {
    if (message.name === 'quote_request') {
      const equipment = ['reefer', 'dryvan', 'flatbed'].includes(message.equipment) ? message.equipment : 'not set';
      gtag('event', 'quote_request', { equipment: equipment });
    } else if (message.name === 'contact_request') {
      gtag('event', 'contact_request');
    }
  }
  function signalReady() {
    window.parent.postMessage({ type: 'blue-valor-analytics-ready' }, window.location.origin);
  }
  window.addEventListener('message', function (event) {
    if (event.origin !== window.location.origin || event.source !== window.parent) return;
    const message = event.data;
    if (message && message.type === 'blue-valor-conversion') {
      if (!['quote_request', 'contact_request'].includes(message.name)) return;
      if (!configured) pendingConversions.push({ name: message.name, equipment: message.equipment });
      else sendConversion(message);
      return;
    }
    if (!message || message.type !== 'blue-valor-page-view' ||
        !/^G-[A-Z0-9]{5,}$/.test(message.measurementId) || !pages.has(message.path) ||
        typeof message.base !== 'string' || !/^(\/[a-zA-Z0-9_-]+)*$/.test(message.base)) return;
    if (message.path === lastPath) {
      signalReady();
      return;
    }
    const url = window.location.origin + message.base + message.path;
    const title = titles[message.path] + ' | Blue Valor Logistics';
    document.title = title;
    if (!configured) {
      configured = true;
      gtag('js', new Date());
      gtag('config', message.measurementId, {
        send_page_view: false,
        allow_google_signals: false,
        allow_ad_personalization_signals: false,
        ignore_referrer: true,
        debug_mode: message.debug === true,
        page_location: url,
        page_referrer: '',
        page_title: title
      });
      const script = document.createElement('script');
      script.id = 'blue-valor-ga4';
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(message.measurementId);
      document.head.appendChild(script);
    }
    gtag('set', { page_location: url, page_referrer: '', page_title: title });
    gtag('event', 'page_view', {
      page_location: url,
      page_path: message.path,
      page_title: title,
      page_referrer: lastPath ? window.location.origin + message.base + lastPath : '',
      send_to: message.measurementId
    });
    lastPath = message.path;
    for (const conversion of pendingConversions.splice(0)) sendConversion(conversion);
    signalReady();
  });
</script>
</body>
</html>
